name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ZyntraCare
          sparse-checkout-cone-mode: false

      - name: Checkout ZyntraCare
        run: |
          cd ZyntraCare
          git checkout main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ZyntraCare/ZyntraCare/package-lock.json

      - name: Install dependencies
        run: cd ZyntraCare/ZyntraCare && npm ci

      - name: Build web app
        run: cd ZyntraCare/ZyntraCare && npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "dummy_secret_for_build"

      - name: Sync Capacitor Android
        run: cd ZyntraCare/ZyntraCare && npx cap sync android

      - name: Build Android APK
        run: |
          cd ZyntraCare/ZyntraCare/android/App
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyntraCare-debug.apk
          path: ZyntraCare/ZyntraCare/android/App/build/outputs/apk/debug/App-debug.apk