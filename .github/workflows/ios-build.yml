name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd ZyntraCare && npm ci --legacy-peer-deps

      - name: Build web app
        run: cd ZyntraCare && npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "dummy_secret_for_build"

      - name: Sync Capacitor iOS
        run: cd ZyntraCare && npx cap sync ios

      - name: Build iOS
        run: |
          cd ZyntraCare/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ZyntraCare/ios/App/App/build/Debug-iphonesimulator/App.app
          retention-days: 5