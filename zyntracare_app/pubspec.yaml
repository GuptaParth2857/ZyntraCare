name: zyntracare
description: "ZyntraCare - India's #1 Healthcare Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # UI Components
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  
  # Storage
  shared_preferences: ^2.2.3
  
  # Network
  http: ^1.2.1
  
  # URL Launcher (for calls)
  url_launcher: ^6.2.5
  
  # Utilities
  intl: ^0.19.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sharing
  share_plus: ^10.0.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  
  # Splash
  flutter_native_splash: ^2.3.9
  
  # Permissions
  permission_handler: ^11.3.1
  google_sign_in: ^7.2.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Camera / ML
  camera: ^0.11.1
  mobile_scanner: ^6.0.6
  google_mlkit_text_recognition: ^0.14.0

  # Web3 / Blockchain
  web3dart: ^2.7.3

  # Video / WebRTC
  flutter_webrtc: ^0.12.7

  # Bluetooth / IoT
  flutter_blue_plus: ^1.33.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/